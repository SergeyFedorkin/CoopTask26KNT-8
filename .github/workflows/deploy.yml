name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверка кода
        run: |
          pip install -q -r requirements.txt
          python -m compileall -q .
          if [ -d tests ]; then pip install -q pytest pytest-asyncio && pytest -q; fi

      - name: Выкатка на сервер
        if: env.HOST != ''   # пока секреты не добавлены — только проверка кода
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 diary@"$HOST" 'bash /opt/diary_bot/deploy/update.sh'
